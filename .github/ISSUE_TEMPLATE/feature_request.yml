name: Feature request
description: Suggest an improvement for OpenRemote
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for helping shape OpenRemote.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Requested feature
      description: What should OpenRemote add or change?
      placeholder: It would help if...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Screenshots, workflows, or related details.
    validations:
      required: false
