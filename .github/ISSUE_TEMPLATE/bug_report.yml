name: Bug report
description: Report a problem with OpenRemote
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Concrete repro steps help most.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do?
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Docs site
        - OpenCode plugin
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Logs, screenshots, device info, OpenCode version, or network setup.
    validations:
      required: false
